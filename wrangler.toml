name = "just-a-chit-chat"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- KV namespace ---
# Create with:  wrangler kv:namespace create CC_DATA
# Then paste the returned id below.
kv_namespaces = [
  { binding = "CC_DATA", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# --- Teacher password ---
# Lives in KV (not hardcoded in this file or the source).
# Set/replace it once with:
#   wrangler kv:key put --binding=CC_DATA "config:teacher_password" "yourSecretPassword"
# It can also be changed later from inside the Teacher Tools > Settings tab.

# --- AI marking: Groq -> Gemini -> Workers AI -> offline scorer ---
# 1st marker: Groq (fast, generous free tier). Set the real key as a Worker
# SECRET - never paste it into this file or any source file:
#   wrangler secret put GROQ_API_KEY
# (paste the key from console.groq.com when prompted)
#
# 2nd marker: Google Gemini (also a generous free tier). Also a Worker SECRET:
#   wrangler secret put GEMINI_API_KEY
# (paste the key from aistudio.google.com/apikey when prompted)
#
# 3rd marker: Cloudflare Workers AI. Free, built in, no signup - this binding
# is all it needs.
#
# If GROQ_API_KEY is missing or a Groq call fails, marking falls back to
# Gemini; if that's also missing/fails, it falls back to Workers AI; if that's
# also unavailable, it falls back further to an offline rule-based scorer so
# the app never hard-fails.
[ai]
binding = "AI"
